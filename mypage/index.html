<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>마이페이지 | 고로소프트 GOROSOFT</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#121316">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;800&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/auth.css?v=20261028e">
<style>
.authwrap.wide{max-width:680px}
.mp-head{text-align:center;padding:8px 0 6px}
.mp-head h1{font:800 clamp(28px,5vw,36px)/1.3 var(--sans);letter-spacing:-.01em;margin:0 0 12px}
.mp-head h1::before{display:none}
.mp-head p{color:var(--muted);font-size:15px;line-height:1.8;margin:0}
.mp-head p b{color:var(--text)}
.mp-sec{margin-top:34px}
.mp-sec h2{font:700 19px/1.4 var(--sans);margin:0;padding-bottom:12px;border-bottom:2px solid var(--text)}
.rows{display:grid}
.row{display:grid;grid-template-columns:8.5em minmax(0,1fr);align-items:center;border-bottom:1px solid var(--line)}
.row>dt{align-self:stretch;display:flex;align-items:center;background:#16181c;color:var(--muted);font:500 14px var(--sans);padding:14px 16px}
.row>dd{margin:0;padding:12px 16px;word-break:break-all}
.row small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.pwbox{grid-column:1/-1;padding:18px 16px 20px;border-top:1px dashed var(--line);background:#17191d}
.pwbox .tbl{margin-top:0}
.pwbtns{display:flex;gap:8px;margin-top:14px}
.pwbtns .btn{flex:1;padding:11px;font-size:14px;border-radius:8px}
.mp-foot{display:flex;justify-content:space-between;align-items:center;margin-top:28px}
.mp-foot .sw{color:var(--muted);font-size:13px}
.delbox{margin-top:16px;border:1px solid var(--line);border-radius:10px;padding:16px}
.loading{color:var(--muted);text-align:center;padding:40px 0}
@media (max-width:520px){.row{grid-template-columns:6.6em minmax(0,1fr)}.row>dt{padding:12px}.row>dd{padding:10px 12px}}
</style>
</head>
<body>
<header class="top"><div class="bar">
  <a class="brand" href="/" aria-label="고로소프트 홈으로"><svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="11.5" fill="#121316"/><path d="M32.72 42.58C41.98 42.58 48.63 36.8 48.63 27.15V22.39H33.13V28.68H40.36C40.26 32.61 37.57 35.06 32.79 35.06C27.33 35.06 24.13 31.01 24.13 23.97C24.13 16.98 27.5 12.98 32.76 12.98C36.33 12.98 38.76 14.75 39.58 17.74H48.24C47.35 10.53 40.92 5.46 32.62 5.46C22.99 5.46 15.37 12.28 15.37 24.09C15.37 35.52 22.38 42.58 32.72 42.58Z" fill="#ffffff"/><rect x="15.37" y="50.75" width="33.26" height="7.80" fill="#b5e04b"/></svg><b>GOROSOFT</b></a>
  <a class="back" href="/">← 홈으로</a>
</div></header>
<main class="authwrap wide"><div class="authcard">
  <div class="mp-head">
    <h1>마이페이지</h1>
    <p>고로소프트는 회원의 개인정보를 <b>소중히 다룹니다.</b><br>입력하신 정보는 동의 없이 공개되지 않으며,<br><a href="/privacy/">개인정보처리방침</a>에 따라 보호됩니다.</p>
  </div>

  <p class="loading" id="mpLoading">회원 정보를 불러오고 있어요…</p>

  <div id="mpBody" hidden>
    <section class="mp-sec" aria-labelledby="infoTitle">
      <h2 id="infoTitle">회원정보</h2>
      <dl class="rows">
        <div class="row"><dt>이메일</dt><dd id="vEmail"></dd></div>
        <div class="row"><dt>이름</dt><dd><span id="vName"></span><small>이름은 가입 후 변경할 수 없습니다.</small></dd></div>
        <div class="row"><dt>가입일</dt><dd id="vJoined">-</dd></div>
        <div class="row"><dt>비밀번호</dt><dd><button type="button" class="btn" id="pwOpen" aria-expanded="false" aria-controls="pwBox">비밀번호 변경</button></dd>
          <form class="pwbox" id="pwBox" hidden>
            <input type="email" id="pwUser" autocomplete="username" hidden>
            <div class="tbl">
              <div class="f"><label for="mCur">현재 비밀번호</label><input id="mCur" type="password" autocomplete="current-password" required></div>
              <div class="f"><label for="mNew">새 비밀번호</label><input id="mNew" type="password" minlength="8" autocomplete="new-password" required></div>
              <div class="f"><label for="mNew2">새 비밀번호 확인</label><input id="mNew2" type="password" minlength="8" autocomplete="new-password" required></div>
            </div>
            <p class="hint" id="npMatch" role="status" aria-live="polite"></p>
            <p class="msg" id="pwMsg" role="status" aria-live="polite"></p>
            <div class="pwbtns"><button type="button" class="btn" id="pwCancel">취소</button><button type="submit" class="btn pri" id="pwSubmit">변경하기</button></div>
          </form>
        </div>
      </dl>
    </section>

    <div class="mp-foot">
      <button type="button" class="btn" id="logoutBtn">로그아웃</button>
      <button type="button" class="sw" id="delOpen" aria-expanded="false" aria-controls="delForm">회원 탈퇴</button>
    </div>
    <form class="delbox" id="delForm" hidden>
      <p class="note" style="margin-top:0">탈퇴하면 계정과 가입 정보가 삭제되며 되돌릴 수 없습니다. 같은 이메일로 다시 가입할 수는 있습니다.</p>
      <div class="tbl">
        <div class="f"><label for="dPw">현재 비밀번호</label><input id="dPw" type="password" autocomplete="current-password" required></div>
      </div>
      <label class="agree"><input type="checkbox" id="dOk" required><span>위 내용을 확인했으며 탈퇴에 동의합니다.</span></label>
      <button type="submit" class="btn full" id="delSubmit" style="background:#ff8a80;border-color:#ff8a80;color:#2a0a08">탈퇴하기</button>
      <p class="msg" id="delMsg" role="status" aria-live="polite"></p>
    </form>
  </div>
</div></main>
<footer>상호 고로소프트 · 대표자 노승현 · <a href="/privacy/">개인정보처리방침</a> · <a href="/terms/">이용약관</a><br>© 2026 GOROSOFT. All rights reserved.</footer>
<script type="module">
import { firebaseConfig, SDK } from '/firebase-config.js?v=20261026b';

const $ = (id) => document.getElementById(id);
let a = null, auth = null, fs = null;

function say(el, text, ok) { el.textContent = text || ''; el.classList.toggle('ok', !!ok); }
function errText(err) {
  switch (err && err.code) {
    case 'auth/weak-password': return '비밀번호가 너무 쉽습니다. 8자 이상으로 더 복잡하게 만들어 주세요.';
    case 'auth/invalid-credential':
    case 'auth/wrong-password': return '현재 비밀번호가 올바르지 않습니다.';
    case 'auth/too-many-requests': return '시도가 너무 많습니다. 잠시 후 다시 시도해 주세요.';
    case 'auth/network-request-failed': return '네트워크 연결을 확인해 주세요.';
    case 'auth/requires-recent-login': return '보안을 위해 다시 로그인한 뒤 시도해 주세요.';
    default: return '처리 중 문제가 생겼습니다. 잠시 후 다시 시도해 주세요.';
  }
}
const fmtDate = (d) => d.getFullYear() + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + String(d.getDate()).padStart(2, '0');

async function init() {
  try {
    const [appMod, authMod, fsMod] = await Promise.all([
      import(SDK + 'firebase-app.js'),
      import(SDK + 'firebase-auth.js'),
      import(SDK + 'firebase-firestore.js').catch(() => null)
    ]);
    const app = appMod.initializeApp(firebaseConfig);
    auth = authMod.getAuth(app);
    auth.languageCode = 'ko';
    fs = fsMod ? { m: fsMod, db: fsMod.getFirestore(app) } : null;
    a = authMod;
  } catch (_) { $('mpLoading').textContent = '네트워크 연결을 확인한 뒤 새로고침해 주세요.'; return; }

  /* 로그인(이메일 인증 완료)한 회원만 볼 수 있습니다 */
  a.onAuthStateChanged(auth, (u) => {
    if (!u || !u.emailVerified) { location.replace('/login/'); return; }
    show(u);
  });
}

async function show(u) {
  $('vEmail').textContent = u.email || '';
  $('vName').textContent = u.displayName || '(등록된 이름 없음)';
  $('pwUser').value = u.email || '';
  const joined = u.metadata && u.metadata.creationTime ? new Date(u.metadata.creationTime) : null;
  if (joined && !isNaN(joined)) $('vJoined').textContent = fmtDate(joined);
  $('mpLoading').hidden = true;
  $('mpBody').hidden = false;
  try {
    if (!fs) return;
    const snap = await fs.m.getDoc(fs.m.doc(fs.db, 'members', u.uid));
    const d = snap.exists() ? snap.data() : null;
    if (d && d.createdAt && d.createdAt.toDate) $('vJoined').textContent = fmtDate(d.createdAt.toDate());
    if (d && d.name && !u.displayName) $('vName').textContent = d.name;
  } catch (_) {}
}

/* 비밀번호 변경 */
const pwBox = $('pwBox'), pwOpen = $('pwOpen');
function togglePw(open) {
  pwBox.hidden = !open; pwOpen.setAttribute('aria-expanded', open); pwOpen.hidden = open;
  if (open) { pwBox.reset(); checkNewMatch(); say($('pwMsg'), ''); $('mCur').focus(); }
}
pwOpen.addEventListener('click', () => togglePw(true));
$('pwCancel').addEventListener('click', () => { togglePw(false); pwOpen.focus(); });

function checkNewMatch() {
  const n = $('mNew'), n2 = $('mNew2'), el = $('npMatch');
  if (!n2.value) { el.textContent = ''; el.className = 'hint'; return; }
  const same = n.value === n2.value;
  el.textContent = same ? '비밀번호가 일치합니다.' : '비밀번호가 일치하지 않습니다.';
  el.className = 'hint ' + (same ? 'ok' : 'bad');
}
$('mNew').addEventListener('input', checkNewMatch);
$('mNew2').addEventListener('input', checkNewMatch);

pwBox.addEventListener('submit', async (e) => {
  e.preventDefault();
  const cur = $('mCur').value, nw = $('mNew').value;
  if (nw.length < 8) { say($('pwMsg'), '새 비밀번호는 8자 이상으로 입력해 주세요.'); return; }
  if (nw !== $('mNew2').value) { say($('pwMsg'), '새 비밀번호가 서로 다릅니다.'); return; }
  if (nw === cur) { say($('pwMsg'), '현재 비밀번호와 다른 비밀번호를 입력해 주세요.'); return; }
  const btn = $('pwSubmit'); btn.disabled = true;
  try {
    const u = auth.currentUser;
    await a.reauthenticateWithCredential(u, a.EmailAuthProvider.credential(u.email, cur));
    await a.updatePassword(u, nw);
    say($('pwMsg'), '비밀번호를 변경했습니다. 새 비밀번호로 다시 로그인해 주세요.', true);
    /* 변경 후에는 로그아웃하고 로그인 화면으로 이동 */
    setTimeout(async () => {
      try { await a.signOut(auth); } catch (_) {}
      location.href = '/login/?changed=1';
    }, 1500);
    return;
  } catch (err) { say($('pwMsg'), errText(err)); }
  btn.disabled = false;
});

/* 로그아웃 */
$('logoutBtn').addEventListener('click', async () => {
  try { await a.signOut(auth); } catch (_) {}
  location.href = '/';
});

/* 회원 탈퇴 */
$('delOpen').addEventListener('click', () => {
  const f = $('delForm'); f.hidden = !f.hidden; $('delOpen').setAttribute('aria-expanded', !f.hidden);
  if (!f.hidden) { f.reset(); say($('delMsg'), ''); $('dPw').focus(); }
});
$('delForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = $('delSubmit'); btn.disabled = true;
  try {
    const u = auth.currentUser;
    await a.reauthenticateWithCredential(u, a.EmailAuthProvider.credential(u.email, $('dPw').value));
    try { if (fs) await fs.m.deleteDoc(fs.m.doc(fs.db, 'members', u.uid)); } catch (_) {}
    await a.deleteUser(u);
    location.href = '/login/?deleted=1';
    return;
  } catch (err) { say($('delMsg'), errText(err)); }
  btn.disabled = false;
});

init();
</script>
</body>
</html>
