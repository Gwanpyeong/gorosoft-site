<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GORO Drive 미리보기 | GOROSOFT</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#121316">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GORO Drive">
<link rel="manifest" href="/gdtest/manifest.webmanifest">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/gdtest/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* 출시 전 테스트용 미리보기 — 검색에 노출되지 않게 noindex. 기록은 이 기기에만 저장됨 */
[hidden]{display:none!important}
html,body{margin:0;padding:0}
img{max-width:100%}
:root{
  --bg:#121316; --panel:#1A1C20; --panel2:#202329; --line:#2B2E35; --text:#EEF0F3; --muted:#9AA1AD;
  --accent:#B5E04B; --accent-text:#B5E04B; --ink:#121316; --danger:#FF8A80;
  --c-fuel:#B5E04B; --c-toll:#4FD1C5; --c-park:#F6C453; --c-repair:#FF8A80; --c-ins:#A78BFA; --c-etc:#8A919C;
  --sans:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:400 15px/1.55 var(--sans);word-break:keep-all;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

.app{max-width:460px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);border-left:1px solid var(--line);border-right:1px solid var(--line)}
@media (max-width:480px){.app{border:0}}
.top{flex:none;padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.logo{width:30px;height:30px;flex:none}
.car{flex:1;min-width:0}
.car b{display:block;font-size:16px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.car span{font-size:12.5px;color:var(--muted)}
.month{display:flex;align-items:center;gap:2px;flex:none}
.month button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--panel)}
.month span{min-width:88px;text-align:center;font-weight:700;font-size:14px}

.main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-block:16px calc(96px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.sample{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);background:var(--panel2);border:1px dashed var(--line);border-radius:10px;padding:9px 12px}
.sample b{color:var(--text)}
.sample button{margin-left:auto;flex:none;background:none;border:0;color:var(--accent-text);font-weight:700;font-size:13px;padding:2px 0}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.h2{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.02em;margin:0 0 10px}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat.big{grid-column:1/-1;background:var(--accent);color:var(--ink);border-color:transparent}
.stat .k{font-size:12.5px;opacity:.75}
.stat .v{font-family:var(--mono);font-weight:700;font-size:22px;margin-top:2px;letter-spacing:-.02em}
.stat.big .v{font-size:34px}
.stat .s{font-size:12px;opacity:.7;margin-top:2px}

.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:10px;font-size:13.5px}
.track{height:10px;border-radius:5px;background:var(--panel2);overflow:hidden}
.fill{height:100%;border-radius:5px}
.bar .num{font-size:13px}
.split{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--panel2);margin-top:4px}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}

.list{display:flex;flex-direction:column}
.day{font-size:12.5px;color:var(--muted);font-weight:700;padding:12px 2px 6px}
.item{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 12px 12px 14px;margin-bottom:8px}
.ico{width:36px;height:36px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--panel2);font-weight:900;font-size:13px}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t span{font-size:12.5px;color:var(--muted)}
.item .r{text-align:right;flex:none}
.item .r .num{font-weight:700}
.chip{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.chip.work{border-color:transparent;background:var(--accent);color:var(--ink)}
.del{background:none;border:0;color:var(--muted);font-size:18px;width:28px;height:28px;border-radius:6px;flex:none}
.del:hover{color:var(--danger)}
.empty{text-align:center;color:var(--muted);padding:40px 10px;font-size:14px}

.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:11px 14px;font-weight:700;font-size:14px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1}
.pro{display:inline-block;font:700 10.5px/1 var(--mono);letter-spacing:.06em;background:var(--text);color:var(--bg);padding:3px 6px;border-radius:4px;vertical-align:2px;margin-left:6px}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:left}
td.num,th.n,td.n{white-space:nowrap}
th{background:var(--panel2);color:var(--muted);font-weight:700}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.note{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);font-weight:700;font-size:13.5px;padding:10px 16px;border-radius:999px;z-index:40;box-shadow:0 8px 24px rgba(0,0,0,.3)}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;pointer-events:none}
.tabs nav{pointer-events:auto;width:100%;max-width:460px;display:grid;grid-template-columns:repeat(6,1fr);background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs button{background:none;border:0;padding:9px 0 10px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--muted)}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--text)}
.tabs button[aria-current="page"] svg{color:var(--accent-text)}
.fab{position:fixed;z-index:21;bottom:calc(76px + env(safe-area-inset-bottom,0px));right:max(16px,calc(50% - 214px));width:56px;height:56px;border-radius:18px;border:0;background:var(--accent);color:var(--ink);font-size:30px;font-weight:400;box-shadow:0 10px 24px rgba(0,0,0,.35)}

.scrim{position:fixed;inset:0;z-index:30;background:rgba(5,8,12,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:460px;background:var(--panel);border-radius:20px 20px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:88%;overflow-y:auto}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h3{margin:0 0 14px;font-size:18px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:12.5px;color:var(--muted);font-weight:700}
.field input,.field select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 12px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--ink);font-weight:700}
.err{color:var(--danger);font-size:13px;min-height:1.2em;margin:2px 0 8px}
.confirm{display:flex;align-items:center;gap:8px;font-size:13px}
.scanbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--panel);border:1px dashed var(--accent-text);border-radius:14px;padding:14px}
.scanbtn .cam{width:40px;height:40px;border-radius:12px;background:var(--accent);color:var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.scanbtn b{display:block;font-size:15px}
.scanbtn span{font-size:12.5px;color:var(--muted)}
.soon{display:inline-block;font:700 10.5px/1 var(--sans);background:var(--accent);color:var(--ink);padding:3px 6px;border-radius:4px;vertical-align:2px;margin-left:6px}
.shot{position:relative;margin:4px auto 14px;width:260px;max-width:100%;background:#2A2D33;border-radius:16px;padding:18px 0;overflow:hidden}
.receipt{width:210px;margin:0 auto;background:#FAFAF6;color:#222;font:12px/1.65 var(--mono);padding:14px 14px 18px;transform:rotate(-1.5deg);box-shadow:0 8px 20px rgba(0,0,0,.35)}
.receipt .c{text-align:center}
.receipt .hr{border-top:1px dashed #999;margin:6px 0}
.receipt .l{display:flex;justify-content:space-between;border-radius:3px;padding:0 3px;margin:0 -3px;transition:background .3s}
.receipt .l.hit{background:rgba(181,224,75,.55)}
.scanline{position:absolute;left:0;right:0;height:3px;background:var(--accent);box-shadow:0 0 14px 4px rgba(181,224,75,.6);top:0}
.found{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:0 0 6px}
.found dt{color:var(--muted)}
.trip{background:var(--panel);border:1px solid var(--accent-text);border-radius:14px;padding:16px}
.trip .t1{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.trip h4{margin:0;font-size:17px}
.trip .meta{font-size:12.5px;color:var(--muted);margin-top:2px}
.trip .sum{font:700 26px var(--mono);margin:12px 0 2px;letter-spacing:-.02em}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.cats div{background:var(--panel2);border-radius:8px;padding:7px 8px;font-size:11.5px;color:var(--muted)}
.cats b{display:block;font:700 13px var(--mono);color:var(--text)}
.payers{display:flex;gap:8px;margin-top:10px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.payers b{color:var(--text);font-family:var(--mono)}
.bigscan{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:var(--accent);color:var(--ink);border:0;border-radius:14px;padding:16px;font-weight:900;font-size:16px}
.bigscan svg{width:24px;height:24px}
.rcpt{font-size:11px;color:var(--muted);font-family:var(--mono)}
.warn{color:var(--danger);font-size:12px;font-weight:700}
.prev table{font-size:11.5px}
.prev td,.prev th{padding:6px;white-space:nowrap}
.photo{position:relative;height:300px;border-radius:14px;background:#2A2D33 center/contain no-repeat;overflow:hidden}
.scanned{display:flex;gap:12px;align-items:center;background:var(--panel2);border-radius:12px;padding:10px;margin-bottom:10px}
.scanned .thumb{width:54px;height:72px;border-radius:8px;background:#2A2D33 center/cover no-repeat;flex:none}
.scanned b{display:block;font-size:14.5px}
.scanned span{font-size:12.5px;color:var(--muted)}
.raw{margin:0 0 14px;font-size:12.5px;color:var(--muted)}
.raw summary{cursor:pointer;padding:2px 0}
.raw pre{white-space:pre-wrap;word-break:break-all;font:11.5px/1.5 var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;max-height:180px;overflow:auto;margin:6px 0 0}
.found dd{margin:0;font-weight:700}
/* 시작 로고(매번) + 첫 실행 환영 화면 */
#splash{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .35s ease,visibility .35s}
#splash.out{opacity:0;visibility:hidden}
#splash svg{width:96px;height:96px;animation:splashIn .5s ease-out both}
#splash svg .bar{transform-origin:15.37px 54px;animation:logobar .7s .25s cubic-bezier(.2,.8,.2,1) both}
#splash b{font:900 22px/1 var(--sans);letter-spacing:.04em;animation:splashIn .5s .15s ease-out both}
#splash span{font:500 13px/1 var(--sans);color:var(--muted);letter-spacing:.14em;animation:splashIn .5s .3s ease-out both}
@keyframes splashIn{from{opacity:0;transform:translateY(6px) scale(.96)}to{opacity:1;transform:none}}
@keyframes logobar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.welcome{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;display:flex;justify-content:center}
.welcome .in{width:100%;max-width:460px;min-height:100%;display:flex;flex-direction:column;padding:calc(48px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px))}
.welcome .mark{width:64px;height:64px}
.welcome h1{font:900 34px/1.15 var(--sans);margin:22px 0 10px;letter-spacing:-.02em}
.welcome h1 em{font-style:normal;color:var(--accent-text)}
.welcome .lead{color:var(--muted);font-size:15.5px;margin:0 0 28px}
.feat{display:flex;flex-direction:column;gap:12px;margin-bottom:auto}
.feat div{display:flex;gap:14px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.feat i{flex:none;width:38px;height:38px;border-radius:11px;background:var(--accent);color:var(--ink);display:flex;align-items:center;justify-content:center;font:900 15px var(--sans);font-style:normal}
.feat b{display:block;font-size:15px}
.feat span{font-size:13px;color:var(--muted)}
.welcome .cta{display:flex;flex-direction:column;gap:10px;margin-top:28px}
.welcome .cta .btn{padding:15px;font-size:15.5px}
.linkbtn{background:none;border:0;color:var(--muted);font-size:13px;padding:8px;text-decoration:underline;text-underline-offset:3px}
.probadge{display:inline-block;font:800 10px/1 var(--mono);letter-spacing:.06em;background:var(--accent);color:var(--ink);padding:3px 5px;border-radius:4px;vertical-align:2px;margin-left:5px}
#printArea{display:none}
@media print{body>*:not(#printArea){display:none!important}#printArea{display:block!important;color:#000;background:#fff;font:12px/1.5 var(--sans);padding:10mm}#printArea table{border-collapse:collapse;width:100%}#printArea th,#printArea td{border:1px solid #999;padding:4px 6px;color:#000;background:#fff}#printArea h1{font-size:18px;margin:0 0 6px}}
@media (prefers-reduced-motion: reduce){#splash svg,#splash svg .bar,#splash b,#splash span{animation:none}}
@media (prefers-reduced-motion: no-preference){
  .scanline{animation:scan 1.6s ease-in-out infinite}
  @keyframes scan{from{top:0}90%{opacity:1}to{top:100%;opacity:0}}
  .sheet{animation:up .22s cubic-bezier(.2,.8,.2,1)} .fill{transition:width .5s cubic-bezier(.2,.8,.2,1)}
  @keyframes up{from{transform:translateY(30px);opacity:.4}}
}
</style>
</head>
<body>
<div id="splash" aria-hidden="true">
  <svg viewBox="0 0 64 64"><rect width="64" height="64" rx="12" fill="#1A1C20"/><path d="M32.72 42.58C41.98 42.58 48.63 36.8 48.63 27.15V22.39H33.13V28.68H40.36C40.26 32.61 37.57 35.06 32.79 35.06C27.33 35.06 24.13 31.01 24.13 23.97C24.13 16.98 27.5 12.98 32.76 12.98C36.33 12.98 38.76 14.75 39.58 17.74H48.24C47.35 10.53 40.92 5.46 32.62 5.46C22.99 5.46 15.37 12.28 15.37 24.09C15.37 35.52 22.38 42.58 32.72 42.58Z" fill="#EEF0F3"/><rect class="bar" x="15.37" y="50.75" width="33.26" height="7.8" fill="#B5E04B"/></svg>
  <b>GORO Drive</b>
  <span>GOROSOFT</span>
</div>
<script>
/* 로고를 최소 1.1초 보여주고 사라짐 */
(function(){var t0=Date.now(),done=false;
  window.__hideSplash=function(){if(done)return;done=true;var el=document.getElementById('splash');
    setTimeout(function(){el.classList.add('out');setTimeout(function(){el.remove()},400)},Math.max(0,1100-(Date.now()-t0)))};
  setTimeout(window.__hideSplash,3000);})();
</script>
<div class="welcome" id="welcome" hidden><div class="in">
  <svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#1A1C20"/><path d="M32.72 42.58C41.98 42.58 48.63 36.8 48.63 27.15V22.39H33.13V28.68H40.36C40.26 32.61 37.57 35.06 32.79 35.06C27.33 35.06 24.13 31.01 24.13 23.97C24.13 16.98 27.5 12.98 32.76 12.98C36.33 12.98 38.76 14.75 39.58 17.74H48.24C47.35 10.53 40.92 5.46 32.62 5.46C22.99 5.46 15.37 12.28 15.37 24.09C15.37 35.52 22.38 42.58 32.72 42.58Z" fill="#EEF0F3"/><rect x="15.37" y="50.75" width="33.26" height="7.8" fill="#B5E04B"/></svg>
  <h1>내 차 기록,<br><em>찍으면 끝.</em></h1>
  <p class="lead">운행·유지비·출장 경비를 한 곳에서 정리하는 GORO Drive예요.</p>
  <div class="feat">
    <div><i>찍</i><p style="margin:0"><b>영수증 찍으면 자동 입력</b><span>금액·날짜·주유량을 읽어서 채워 드려요.</span></p></div>
    <div><i>출</i><p style="margin:0"><b>출장 경비 정산까지</b><span>회사 정산 양식 순서로 정리하고 엑셀로 옮겨요.</span></p></div>
    <div><i>내</i><p style="margin:0"><b>기록은 내 폰에만</b><span>가입 없이 바로 쓰고, 서버로 보내지 않아요.</span></p></div>
  </div>
  <div class="cta">
    <button type="button" class="btn pri" id="wStart">내 차 등록하고 시작하기</button>
    <button type="button" class="btn" id="wDemo">예시로 먼저 둘러보기</button>
    <button type="button" class="linkbtn" id="wLogin">고로소프트 계정으로 로그인</button>
  </div>
</div></div>
<div id="printArea"></div>
<div class="app">
  <header class="top">
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="12" fill="#1A1C20"/><path d="M32.72 42.58C41.98 42.58 48.63 36.8 48.63 27.15V22.39H33.13V28.68H40.36C40.26 32.61 37.57 35.06 32.79 35.06C27.33 35.06 24.13 31.01 24.13 23.97C24.13 16.98 27.5 12.98 32.76 12.98C36.33 12.98 38.76 14.75 39.58 17.74H48.24C47.35 10.53 40.92 5.46 32.62 5.46C22.99 5.46 15.37 12.28 15.37 24.09C15.37 35.52 22.38 42.58 32.72 42.58Z" fill="#EEF0F3"/><rect x="15.37" y="50.75" width="33.26" height="7.8" fill="#B5E04B"/></svg>
    <div class="car"><b id="carName">-</b><span id="carSub">-</span></div>
    <div class="month" aria-label="달 선택"><button type="button" id="mPrev" aria-label="이전 달">‹</button><span id="mLabel" class="num"></span><button type="button" id="mNext" aria-label="다음 달">›</button></div>
  </header>
  <main class="main" id="main" aria-live="polite"></main>
</div>
<button type="button" class="fab" id="fab" aria-label="기록 추가" hidden>+</button>
<div class="tabs"><nav id="tabs" aria-label="메뉴">
  <button type="button" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>분석</button>
  <button type="button" data-tab="trips"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8.5 18H15a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h6.5"/></svg>운행</button>
  <button type="button" data-tab="costs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h4"/></svg>비용</button>
  <button type="button" data-tab="biz"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/></svg>출장</button>
  <button type="button" data-tab="report"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg>보고서</button>
  <button type="button" data-tab="car"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 16h14v-4l-2-5H7l-2 5z"/><circle cx="8" cy="17" r="1.6"/><circle cx="16" cy="17" r="1.6"/></svg>차량</button>
</nav></div>
<div id="sheetHost"></div>

<script>
(function(){
const CATS = [
  {id:'fuel',name:'주유비',short:'주유',color:'var(--c-fuel)'},
  {id:'toll',name:'통행료',short:'통행',color:'var(--c-toll)'},
  {id:'park',name:'주차비',short:'주차',color:'var(--c-park)'},
  {id:'repair',name:'정비비',short:'정비',color:'var(--c-repair)'},
  {id:'ins',name:'보험료',short:'보험',color:'var(--c-ins)'},
  {id:'etc',name:'기타',short:'기타',color:'var(--c-etc)'}
];
const PURPOSE = ['업무','출퇴근','개인'];
const FUELS = {
  gas:   {t:'휘발유', unit:'L',   cost:'주유비',     short:'주유', verb:'주유량'},
  diesel:{t:'경유',   unit:'L',   cost:'주유비',     short:'주유', verb:'주유량'},
  ev:    {t:'전기',   unit:'kWh', cost:'충전비',     short:'충전', verb:'충전량'},
  h2:    {t:'수소',   unit:'kg',  cost:'수소충전비', short:'수소', verb:'충전량'}
};
const KEY = 'gorodrive.v1';
const $ = (id) => document.getElementById(id);
const won = (n) => '₩' + Math.round(n).toLocaleString('ko-KR');
const km = (n) => Math.round(n).toLocaleString('ko-KR') + ' km';
const pad = (n) => String(n).padStart(2,'0');
const ymd = (d) => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2,9);

/* ── 예시 데이터: 이번 달과 지난달 ── */
function sample(){
  const now = new Date(); const y = now.getFullYear(), m = now.getMonth(), today = now.getDate();
  const d = (mo, day) => ymd(new Date(y, mo, Math.min(day, mo === m ? today : 28)));
  const T = [], C = [];
  const trips = [
    [1,'집','판교 사무실',23,'출퇴근'],[2,'판교 사무실','수원 고객사',31,'업무'],[2,'수원 고객사','판교 사무실',31,'업무'],
    [5,'집','판교 사무실',23,'출퇴근'],[7,'판교 사무실','청주 사업장',118,'업무'],[7,'청주 사업장','집',104,'업무'],
    [10,'집','마트',6,'개인'],[13,'집','판교 사무실',23,'출퇴근'],[15,'판교 사무실','용인 고객사',27,'업무'],
    [18,'집','부모님 댁',42,'개인'],[21,'집','판교 사무실',23,'출퇴근'],[23,'판교 사무실','평택 고객사',58,'업무'],
    [24,'평택 고객사','집',49,'업무'],[27,'집','판교 사무실',23,'출퇴근']
  ];
  trips.forEach(([day,f,t,dist,p]) => { if (day <= today) T.push({id:uid(),date:d(m,day),from:f,to:t,km:dist,purpose:p}); });
  [[3,'집','판교 사무실',23,'출퇴근'],[9,'판교 사무실','이천 고객사',64,'업무'],[9,'이천 고객사','집',51,'업무'],[16,'집','공항',71,'개인'],[22,'판교 사무실','안산 고객사',47,'업무']]
    .forEach(([day,f,t,dist,p]) => T.push({id:uid(),date:d(m-1,day),from:f,to:t,km:dist,purpose:p}));
  const q = (c,a) => c === 'fuel' ? Math.round(a/1650*10)/10 : undefined;
  const costs = [[2,'fuel',36000,'셀프 주유'],[7,'toll',8400,'청주 왕복'],[8,'park',12000,'청주 사업장'],[15,'repair',89000,'타이어 위치 교환'],
    [15,'park',3000,''],[19,'etc',15000,'손세차'],[20,'fuel',38000,''],[23,'toll',4600,'평택']];
  costs.forEach(([day,c,a,memo]) => { if (day <= today) C.push({id:uid(),date:d(m,day),cat:c,amount:a,memo,qty:q(c,a)}); });
  [[4,'fuel',34000,''],[9,'toll',5200,''],[12,'ins',684000,'자동차보험 갱신'],[22,'park',6000,'']]
    .forEach(([day,c,a,memo]) => C.push({id:uid(),date:d(m-1,day),cat:c,amount:a,memo,qty:q(c,a)}));
  const total = T.reduce((s,t)=>s+t.km,0);
  const bd = (off) => ymd(new Date(y, m, Math.max(1, today - 3 + off)));
  const E = (off,cat,shop,desc,payer,amount,qty) => ({id:uid(), biz:'b1', date:bd(off), cat, shop, desc, payer, amount, qty, receipt:true});
  const biz = [{id:'b1', name:'1차 청주 출장', place:'청주 고객사 사업장', start:bd(0), end:bd(3), members:['나','김OO']}];
  const bizExp = [
    E(0,'숙박','트립닷컴(청주 호텔)','3박 일괄 결제 · 1인실','김OO',213581),
    E(0,'숙박','트립닷컴(청주 호텔)','3박 일괄 결제 · 1인실','나',206975),
    E(0,'주유','GS칼텍스 용인주유소','휘발유 · 공동','나',61200,37.1),
    E(0,'통행료','한국도로공사','하행 · 공동','나',7800),
    E(0,'식대','청주 한식당','2인 저녁','김OO',34000),
    E(1,'식대','김밥천국 청주점','2인 아침','나',13000),
    E(1,'식대','청주 칼국수','2인 점심','나',18000)
  ];
  return {sample:true, cars:[{id:'c1',name:'아반떼',plate:'12가 3456',fuel:'gas',odo:48210+total}], carId:'c1', trips:T, costs:C, biz, bizExp, bizId:'b1'};
}
function load(){ try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.cars) return s; } catch(_){} return sample(); }
let S = load();
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(_){} }

const now = new Date();
let month = now.getFullYear()+'-'+pad(now.getMonth()+1);
let tab = 'home';

const car = () => S.cars.find(c => c.id === S.carId) || S.cars[0];
const fuel = () => FUELS[car().fuel] || FUELS.gas;
const catName = (id) => id === 'fuel' ? fuel().cost : (CATS.find(c=>c.id===id) || CATS[5]).name;
const catShort = (id) => id === 'fuel' ? fuel().short : (CATS.find(c=>c.id===id) || CATS[5]).short;
const catColor = (id) => (CATS.find(c=>c.id===id) || CATS[5]).color;
const qtyText = (q) => (Math.round(q*10)/10).toLocaleString('ko-KR') + ' ' + fuel().unit;
const inMonth = (arr) => arr.filter(x => x.date.startsWith(month) && (!x.car || x.car === S.carId)).sort((a,b)=>b.date.localeCompare(a.date));
function shiftMonth(n){ const [y,m] = month.split('-').map(Number); const d = new Date(y, m-1+n, 1); month = d.getFullYear()+'-'+pad(d.getMonth()+1); render(); }
const monthLabel = () => { const [y,m] = month.split('-'); return y+'.'+m; };
const dayLabel = (s) => { const d = new Date(s+'T00:00'); return (d.getMonth()+1)+'월 '+d.getDate()+'일 ('+'일월화수목금토'[d.getDay()]+')'; };

function toast(msg){ const t = document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 1800); }

function sampleBar(){
  if (!S.sample) return '';
  return '<div class="sample" id="sampleBar"><span><b>예시 데이터</b>로 채워져 있어요. 직접 기록해 보세요.</span><button type="button" id="clearSample">예시 지우기</button></div>';
}

/* ── 분석 ── */
function viewHome(){
  const T = inMonth(S.trips), C = inMonth(S.costs);
  const dist = T.reduce((s,t)=>s+t.km,0), spend = C.reduce((s,c)=>s+c.amount,0);
  const work = T.filter(t=>t.purpose==='업무').reduce((s,t)=>s+t.km,0);
  const byCat = CATS.map(c => ({...c, name: catName(c.id), sum: C.filter(x=>x.cat===c.id).reduce((s,x)=>s+x.amount,0)})).filter(c=>c.sum>0).sort((a,b)=>b.sum-a.sum);
  const qty = C.filter(x=>x.cat==='fuel' && x.qty>0).reduce((s,x)=>s+x.qty,0), F = fuel();
  const max = byCat.length ? byCat[0].sum : 1;
  const perKm = dist ? spend/dist : 0;
  const byP = PURPOSE.map(p => ({p, v:T.filter(t=>t.purpose===p).reduce((s,t)=>s+t.km,0)}));
  const pc = {'업무':'var(--accent)','출퇴근':'var(--c-toll)','개인':'var(--c-etc)'};
  return sampleBar() + `
  <div class="hero">
    <div class="stat big"><div class="k">${monthLabel()} 총 지출</div><div class="v">${won(spend)}</div><div class="s">비용 기록 ${C.length}건</div></div>
    <div class="stat"><div class="k">총 운행거리</div><div class="v">${km(dist)}</div><div class="s">운행 ${T.length}회</div></div>
    <div class="stat"><div class="k">1km당 비용</div><div class="v">${dist ? won(perKm) : '-'}</div><div class="s">지출 ÷ 운행거리</div></div>
    <div class="stat"><div class="k">${F.t} ${F.unit === 'L' ? '연비' : '효율'}</div><div class="v">${qty && dist ? (Math.round(dist/qty*10)/10) : '-'}<span style="font-size:13px"> km/${F.unit}</span></div><div class="s">운행거리 ÷ ${F.verb}</div></div>
    <div class="stat"><div class="k">${F.verb}</div><div class="v">${qty ? qtyText(qty) : '-'}</div><div class="s">${F.cost} 기록 기준</div></div>
  </div>
  <section class="card"><p class="h2">항목별 비용</p>
    ${byCat.length ? '<div class="bars">' + byCat.map(c => `<div class="bar"><span>${c.name}</span><div class="track"><div class="fill" style="width:${Math.max(3,c.sum/max*100)}%;background:${c.color}"></div></div><span class="num">${won(c.sum)}</span></div>`).join('') + '</div>' : '<p class="empty" style="padding:14px 0">이번 달 비용 기록이 없어요.</p>'}
  </section>
  <section class="card"><p class="h2">운행 목적</p>
    ${dist ? `<div class="split">${byP.filter(x=>x.v).map(x=>`<div style="width:${x.v/dist*100}%;background:${pc[x.p]}"></div>`).join('')}</div>
    <div class="legend">${byP.map(x=>`<span><i class="dot" style="background:${pc[x.p]}"></i>${x.p} <b class="num">${Math.round(x.v/dist*100)}%</b> · ${km(x.v)}</span>`).join('')}</div>
    <p class="note">업무 운행 ${km(work)} · 업무용 운행기록부는 보고서 탭에서 만들 수 있어요.</p>` : '<p class="empty" style="padding:14px 0">이번 달 운행 기록이 없어요.</p>'}
  </section>`;
}

/* ── 운행 ── */
function groupByDay(items, row){
  if (!items.length) return '';
  let out = '', last = '';
  items.forEach(x => { if (x.date !== last){ out += `<p class="day">${dayLabel(x.date)}</p>`; last = x.date; } out += row(x); });
  return '<div class="list">' + out + '</div>';
}
function viewTrips(){
  const T = inMonth(S.trips);
  const head = `<div class="card" style="display:flex;justify-content:space-between;align-items:center"><div><p class="h2" style="margin:0">${monthLabel()} 운행</p><b class="num" style="font-size:20px">${km(T.reduce((s,t)=>s+t.km,0))}</b></div><span class="chip">${T.length}회</span></div>`;
  return sampleBar() + head + (T.length ? groupByDay(T, t => `
    <div class="item"><div class="ico" style="color:var(--accent-text)">${t.purpose[0]}</div>
      <div class="t"><b>${esc(t.from)} → ${esc(t.to)}</b><span><span class="chip ${t.purpose==='업무'?'work':''}">${t.purpose}</span></span></div>
      <div class="r"><span class="num">${km(t.km)}</span></div>
      <button type="button" class="del" data-del-trip="${t.id}" aria-label="이 운행 기록 삭제">×</button></div>`)
    : '<p class="empty">이 달에는 운행 기록이 없어요.<br>오른쪽 아래 + 버튼으로 추가해 보세요.</p>');
}

/* ── 비용 ── */
function viewCosts(){
  const C = inMonth(S.costs);
  const head = `<div class="card" style="display:flex;justify-content:space-between;align-items:center"><div><p class="h2" style="margin:0">${monthLabel()} 지출</p><b class="num" style="font-size:20px">${won(C.reduce((s,c)=>s+c.amount,0))}</b></div><span class="chip">${C.length}건</span></div>`;
  const scan = `<button type="button" class="scanbtn" id="openScan"><span class="cam"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></span><span><b>영수증 찍어서 입력<span class="soon">NEW</span></b><span>금액·날짜·${fuel().verb}을 자동으로 채워 드려요</span></span></button>`;
  return sampleBar() + head + scan + (C.length ? groupByDay(C, c => { const sub = [c.qty ? qtyText(c.qty) : '', c.memo || ''].filter(Boolean).join(' · '); return `
    <div class="item"><div class="ico" style="color:${catColor(c.cat)}">${catShort(c.cat)}</div>
      <div class="t"><b>${catName(c.cat)}</b><span>${esc(sub || ' ')}</span></div>
      <div class="r"><span class="num">${won(c.amount)}</span></div>
      <button type="button" class="del" data-del-cost="${c.id}" aria-label="이 비용 기록 삭제">×</button></div>`; })
    : '<p class="empty">이 달에는 비용 기록이 없어요.<br>오른쪽 아래 + 버튼으로 추가해 보세요.</p>');
}

/* ── 보고서 ── */
let onlyWork = true;
function reportRows(){ return inMonth(S.trips).filter(t => !onlyWork || t.purpose==='업무').sort((a,b)=>a.date.localeCompare(b.date)); }
function csvText(){
  const c = car(), rows = reportRows(), C = inMonth(S.costs).sort((a,b)=>a.date.localeCompare(b.date));
  const q = (v) => '"' + String(v).replace(/"/g,'""') + '"';
  const out = [['차량',c.name,'차량번호',c.plate,'연료',fuel().t,'기간',monthLabel()].map(q).join(','), '', ['일자','출발지','도착지','운행 목적','주행거리(km)'].map(q).join(',')];
  rows.forEach(t => out.push([t.date,t.from,t.to,t.purpose,t.km].map(q).join(',')));
  out.push(['합계','','','',rows.reduce((s,t)=>s+t.km,0)].map(q).join(','), '', ['일자','항목','금액(원)',fuel().verb+'('+fuel().unit+')','메모'].map(q).join(','));
  C.forEach(x => out.push([x.date,catName(x.cat),x.amount,x.qty||'',x.memo||''].map(q).join(',')));
  out.push(['합계','',C.reduce((s,x)=>s+x.amount,0),'',''].map(q).join(','));
  return out.join('\n');
}
function viewReport(){
  const c = car(), rows = reportRows(), C = inMonth(S.costs);
  const total = rows.reduce((s,t)=>s+t.km,0);
  return sampleBar() + `
  <section class="card">
    <p class="h2">${monthLabel()} 운행기록부</p>
    <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13.5px;margin-bottom:10px"><span><b>${esc(c.name)}</b> · ${esc(c.plate)}</span><span class="num">${km(total)} · ${won(C.reduce((s,x)=>s+x.amount,0))}</span></div>
    <div class="seg" style="margin-bottom:12px"><button type="button" id="rWork" aria-pressed="${onlyWork}">업무 운행만</button><button type="button" id="rAll" aria-pressed="${!onlyWork}">전체 운행</button></div>
    ${rows.length ? `<div class="tablewrap"><table><thead><tr><th>일자</th><th>출발지</th><th>도착지</th><th>목적</th><th class="n">거리(km)</th></tr></thead><tbody>
      ${rows.map(t=>`<tr><td class="num">${t.date.slice(5).replace('-','.')}</td><td>${esc(t.from)}</td><td>${esc(t.to)}</td><td>${t.purpose}</td><td class="n">${t.km}</td></tr>`).join('')}
      <tr><td><b>합계</b></td><td></td><td></td><td></td><td class="n"><b>${total}</b></td></tr></tbody></table></div>` : '<p class="empty" style="padding:14px 0">표시할 운행 기록이 없어요.</p>'}
  </section>
  <section class="card">
    <p class="h2">내보내기 <span class="pro">PRO</span>${isPro ? '<span class="probadge">사용 중</span>' : ''}</p>

/* ── 영수증 인식: 진짜 카메라 → 휴대폰(브라우저) 안에서 글자 인식(Tesseract, 한국어+영어) → 금액·날짜·항목 찾기 → 확인 후 저장
   사진은 서버로 보내지 않음. 인식 데이터(약 2MB)는 처음 한 번만 받고 이후엔 저장본 사용 ── */
const TESS_SRC = 'https://cdn.jsdelivr.net/npm/tesseract.js@7.0.0/dist/tesseract.min.js';
let tessWorker = null, tessLoading = null, ocrProgress = () => {};
function loadScript(src){ return new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => no(new Error('script')); document.head.appendChild(s); }); }
function getWorker(){
  if (tessWorker) return Promise.resolve(tessWorker);
  if (!tessLoading) tessLoading = (window.Tesseract ? Promise.resolve() : loadScript(TESS_SRC))
    .then(() => Tesseract.createWorker(['kor','eng'], 1, { logger: m => ocrProgress(m) }))
    .then(w => w.setParameters({ preserve_interword_spaces: '1' }).then(() => (tessWorker = w)))
    .catch(e => { tessLoading = null; throw e; });
  return tessLoading;
}
/* 사진 고르기: camera=true면 카메라 바로 열기 */
function pickPhoto(camera){
  return new Promise(resolve => {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'image/*'; if (camera) inp.setAttribute('capture', 'environment');
    inp.style.display = 'none'; document.body.appendChild(inp);
    inp.onchange = () => { const f = inp.files && inp.files[0]; inp.remove(); resolve(f || null); };
    inp.click();
  });
}
/* 인식 잘 되게: 긴 변 1800px로 맞추고 흑백 + 대비 늘리기 */
function prepImage(file){
  return new Promise((ok, no) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1800 / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.round(img.naturalWidth * k), h = Math.round(img.naturalHeight * k);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const g = c.getContext('2d'); g.drawImage(img, 0, 0, w, h);
      const d = g.getImageData(0, 0, w, h), p = d.data, hist = new Uint32Array(256);
      for (let i = 0; i < p.length; i += 4){ const y = (p[i]*299 + p[i+1]*587 + p[i+2]*114) / 1000 | 0; p[i] = y; hist[y]++; }
      let lo = 0, hi = 255, acc = 0, n = w * h;
      for (; lo < 255 && (acc += hist[lo]) < n * .02; lo++);
      acc = 0; for (; hi > 0 && (acc += hist[hi]) < n * .02; hi--);
      const span = Math.max(1, hi - lo);
      for (let i = 0; i < p.length; i += 4){ const v = Math.max(0, Math.min(255, (p[i] - lo) * 255 / span)); p[i] = p[i+1] = p[i+2] = v; }
      g.putImageData(d, 0, 0);
      ok({ canvas: c, url });
    };
    img.onerror = () => no(new Error('image'));
    img.src = url;
  });
}

/* ── 글자 → 값 찾기 ── */
const RX = {
  toll: /도로공사|통행료|톨게이트|영업소|하이패스|고속도로/,
  park: /주차/,
  repair: /정비|카센터|타이어|엔진오일|오일교환|공업사|블루핸즈|오토큐|스피드메이트|자동차서비스/,
  fuel: /주유|유종|휘발유|경유|셀프|오일뱅크|칼텍스|S-?OIL|에쓰오일|SK에너지|알뜰|충전|kWh|KWH|수소|급속|완속/i,
  stay: /호텔|모텔|숙박|체크인|객실|트립닷컴|야놀자|여기어때|아고다|리조트|게스트하우스|펜션|HOTEL/i,
  meal: /식당|음식|메뉴|인분|공기밥|김밥|국밥|커피|카페|치킨|고기|삼겹|한식|분식|정식|찌개|탕|면|식사|주점|맥주|소주|백반|돈까스|짜장|짬뽕|피자|버거|도시락|편의점|베이커리|빵/
};
const SKIP_LINE = /부가세|부가가치|과세|면세|공급가|VAT|포인트|잔액|거스름|받은돈|받은금액|현금영수증|단가|할인|사업자|전화|TEL|카드번호|승인번호|가맹점|번호|No\.|주소/i;
const AMT_KEYS = ['합계','결제금액','승인금액','받을금액','청구금액','총액','총금액','결제액','판매금액','카드결제','이용금액','통행료','요금','금액'];
const toNum = s => +s.replace(/[^\d]/g, '');
function numsIn(s){ return (s.match(/\d{1,3}(?:[,.]\d{3})+|\d{3,7}/g) || []).map(toNum).filter(v => v >= 100 && v <= 5000000); }
function parseReceipt(text){
  text = (text || '').normalize('NFKC');
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  const flats = lines.map(l => l.replace(/\s+/g, ''));
  const all = flats.join('\n');
  /* 금액: 합계 같은 낱말이 있는 줄(또는 바로 다음 줄)의 가장 큰 수 → 없으면 전체에서 가장 큰 수 */
  let amount = 0;
  for (const k of AMT_KEYS){
    for (let i = 0; i < flats.length && !amount; i++){
      if (!flats[i].includes(k) || (k === '금액' && SKIP_LINE.test(flats[i]))) continue;
      let v = numsIn(flats[i]);
      if (!v.length && flats[i+1] && !SKIP_LINE.test(flats[i+1])) v = numsIn(flats[i+1]);
      if (v.length) amount = Math.max(...v);
    }
    if (amount) break;
  }
  if (!amount){ const v = flats.filter(l => !SKIP_LINE.test(l) && !/\d{2}:\d{2}/.test(l)).flatMap(numsIn); if (v.length) amount = Math.max(...v); }
  /* 날짜 */
  let date = '';
  const today = new Date(), okDate = (y,m,d) => { const t = new Date(y, m-1, d); return m >= 1 && m <= 12 && d >= 1 && d <= 31 && t <= new Date(today.getTime() + 864e5) && y >= today.getFullYear() - 1; };
  let m = text.match(/(20\d{2})\s*[.\-\/년]\s*(\d{1,2})\s*[.\-\/월]\s*(\d{1,2})/);
  if (m && okDate(+m[1], +m[2], +m[3])) date = m[1] + '-' + pad(+m[2]) + '-' + pad(+m[3]);
  if (!date){ m = text.match(/(?:^|[^\d])(\d{2})\s*[.\-\/]\s*(\d{1,2})\s*[.\-\/]\s*(\d{1,2})(?!\d)/); if (m && okDate(2000 + +m[1], +m[2], +m[3])) date = '20' + m[1] + '-' + pad(+m[2]) + '-' + pad(+m[3]); }
  if (!date) date = ymd(today);
  const tm = text.match(/(?:^|[^\d])([01]?\d|2[0-3])\s*:\s*([0-5]\d)/), hour = tm ? +tm[1] : null;
  /* 수량(주유량·충전량) */
  let qty, unit = '';
  const q = text.match(/(\d{1,3}(?:[.,]\d{1,3})?)\s*(ℓ|리터|L|l|kWh|KWH|kwh|kg|KG)(?![a-z])/);
  if (q){ const v = parseFloat(q[1].replace(',', '.')); unit = /k?wh/i.test(q[2]) ? 'kWh' : /kg/i.test(q[2]) ? 'kg' : 'L';
    if ((unit === 'L' && v >= 1 && v <= 200) || (unit === 'kWh' && v >= 1 && v <= 150) || (unit === 'kg' && v >= .3 && v <= 10)) qty = v; }
  const fuelKind = (all.match(/고급휘발유|휘발유|경유|급속|완속|수소/) || [''])[0];
  /* 가게 이름: 위쪽 줄 중 한글 2자 이상이고 안내 문구가 아닌 첫 줄 */
  let shop = '';
  for (const l of lines.slice(0, 6)){
    const f = l.replace(/\s+/g, '');
    if ((f.match(/[가-힣]/g) || []).length < 2 || /영수증|매출전표|전표|카드|신용|승인|고객용|사업자|대표|전화|TEL|주소|일시|날짜|감사|환영|POS|^\d/i.test(f)) continue;
    shop = l.replace(/[^\w가-힣()&·\- ]/g, '').replace(/\s{2,}/g, ' ').trim().slice(0, 24); break;
  }
  return { amount, date, hour, qty, unit, fuelKind, shop, all, raw: text };
}
const FUEL_STRONG = /주유|유종|휘발유|경유|충전량|충전요금|충전기|kWh|수소충전/i;
function carCat(r){ const a = r.all; return RX.toll.test(a) ? 'toll' : FUEL_STRONG.test(a) ? 'fuel' : RX.park.test(a) ? 'park' : RX.repair.test(a) ? 'repair' : RX.fuel.test(a) || r.qty ? 'fuel' : 'etc'; }
function bizGuess(r){
  const a = r.all;
  if (RX.stay.test(a)){ const n = a.match(/(\d)\s*박/); return { cat:'숙박', desc: (n ? n[1] + '박' : '1박') }; }
  if (RX.toll.test(a)) return { cat:'통행료', desc:'통행료' };
  if (FUEL_STRONG.test(a)) return { cat:'주유', desc: [r.fuelKind || '주유', r.qty ? r.qty + (r.unit || 'L') : ''].filter(Boolean).join(' · ') };
  if (RX.park.test(a)) return { cat:'주차', desc:'주차' };
  if (RX.fuel.test(a) || r.qty) return { cat:'주유', desc: [r.fuelKind || '주유', r.qty ? r.qty + (r.unit || 'L') : ''].filter(Boolean).join(' · ') };
  if (RX.meal.test(a)){ const ppl = a.match(/(\d)\s*인분/), h = r.hour; const meal = h == null ? '식사' : h < 10 ? '아침' : h < 15 ? '점심' : '저녁'; return { cat:'식대', desc: (ppl ? ppl[1] + '인 ' : '') + meal }; }
  return { cat:'기타', desc:'' };
}

function scanStart(kind){

    <p class="note" style="margin:0 0 14px">영수증 전체가 화면에 들어오게, 밝은 곳에서 평평하게 놓고 찍어 주세요. 사진은 이 휴대폰 안에서만 읽어요.</p>
    <button type="button" class="bigscan" id="camBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>카메라로 찍기</button>
    <div class="row" style="margin-top:10px"><button type="button" class="btn" id="libBtn">앨범에서 고르기</button><button type="button" class="btn" id="cancel">취소</button></div>`, () => {

  });

function scanRun(file, kind){
  openSheet(`<h3>영수증 인식</h3>
    <div class="photo" id="photoBox"><div class="scanline"></div></div>
    <p id="ocrMsg" style="text-align:center;color:var(--muted);margin:10px 0 6px">사진을 준비하는 중…</p>
    <div class="track" style="margin:0 10px 14px"><div class="fill" id="ocrBar" style="width:4%;background:var(--accent)"></div></div>
    <div class="row"><button type="button" class="btn" id="cancel">취소</button></div>`, () => {
    let alive = true;
    $('cancel').onclick = () => { alive = false; closeSheet(); };
    const msg = t => { if (alive && $('ocrMsg')) $('ocrMsg').textContent = t; };
    const bar = v => { if (alive && $('ocrBar')) $('ocrBar').style.width = Math.max(4, Math.round(v * 100)) + '%'; };
    ocrProgress = m => {
      if (m.status === 'recognizing text') { msg('글자를 읽는 중… ' + Math.round(m.progress * 100) + '%'); bar(.3 + m.progress * .7); }
      else if (/load|initializ/i.test(m.status)) { msg(tessWorker ? '준비하는 중…' : '처음 한 번만 인식 데이터를 받는 중…'); bar(.05 + (m.progress || 0) * .25); }
    };
    let photoUrl = '';
    prepImage(file).then(({ canvas, url }) => {
      photoUrl = url;
      const box = $('photoBox'); if (box) box.style.backgroundImage = `url("${url}")`;
      msg(tessWorker ? '글자를 읽는 중…' : '처음 한 번만 인식 데이터를 받는 중…');
      return getWorker().then(w => w.recognize(canvas));
    }).then(({ data }) => {
      if (!alive) return;
      const r = parseReceipt(data.text || '');
      r.photo = photoUrl;
      if (kind === 'biz') bizConfirmSheet(r); else costSheet(scanToCost(r));
    }).catch(err => {
      if (!alive) return;
      const offline = !navigator.onLine || /script|network|fetch/i.test(String(err && err.message));
      msg(offline && !tessWorker ? '인식 데이터를 받지 못했어요. 인터넷 연결을 확인하고 다시 해 주세요.' : '사진을 읽지 못했어요. 다시 찍거나 직접 입력해 주세요.');
      bar(0);
      const row = document.querySelector('.sheet .row');
      if (row) row.innerHTML = '<button type="button" class="btn" id="again">다시 찍기</button><button type="button" class="btn pri" id="manual">직접 입력</button>';
      $('again').onclick = () => scanStart(kind);
      $('manual').onclick = () => kind === 'biz' ? bizConfirmSheet({ amount:0, date:ymd(new Date()), shop:'', all:'', raw:'' }) : costSheet({ manual:true });
    });
  });
}

const OWNER_EMAILS = ['cube5828@gorosoft.co.kr'];

function setAccount(u){

function loadAuth(){
  if (fb) return fb;
  fb = Promise.all([import('/firebase-config.js?v=20261026b')]).then(([cfg]) =>
    Promise.all([import(cfg.SDK + 'firebase-app.js'), import(cfg.SDK + 'firebase-auth.js')]).then(([appM, authM]) => {
      const auth = authM.getAuth(appM.initializeApp(cfg.firebaseConfig)); auth.languageCode = 'ko';
      authM.onAuthStateChanged(auth, setAccount);
      return { auth, authM };
    })).catch(e => { fb = null; throw e; });
  return fb;
}

    <table><thead><tr><th>일자</th><th>출발지</th><th>도착지</th><th>목적</th><th>거리(km)</th></tr></thead><tbody>${rows.map(t=>`<tr><td>${t.date}</td><td>${esc(t.from)}</td><td>${esc(t.to)}</td><td>${t.purpose}</td><td style="text-align:right">${t.km}</td></tr>`).join('')}
    <tr><td colspan="4"><b>합계</b></td><td style="text-align:right"><b>${rows.reduce((s,t)=>s+t.km,0)}</b></td></tr></tbody></table>
    <h1 style="margin-top:16px">비용 내역</h1><table><thead><tr><th>일자</th><th>항목</th><th>금액(원)</th><th>메모</th></tr></thead><tbody>${C.map(x=>`<tr><td>${x.date}</td><td>${catName(x.cat)}</td><td style="text-align:right">${x.amount.toLocaleString('ko-KR')}</td><td>${esc(x.memo||'')}</td></tr>`).join('')}
    <tr><td colspan="2"><b>합계</b></td><td style="text-align:right"><b>${C.reduce((s,x)=>s+x.amount,0).toLocaleString('ko-KR')}</b></td><td></td></tr></tbody></table>
    <p style="margin-top:12px;color:#666">GORO Drive · GOROSOFT</p>`;
  setTimeout(() => window.print(), 50);
}
function accountCard(){
  if (!account) return `<section class="card"><p class="h2">계정</p><p class="note" style="margin:0 0 12px">로그인하지 않아도 모든 기본 기능을 쓸 수 있어요.</p><button type="button" class="btn" id="loginBtn" style="width:100%">고로소프트 계정으로 로그인</button></section>`;
  return `<section class="card"><p class="h2">계정 ${isPro ? '<span class="probadge">PRO · 대표 계정</span>' : ''}</p>
    <p style="margin:0 0 4px;font-weight:700;word-break:break-all">${esc(account.email)}</p>
    <p class="note" style="margin:0 0 12px">${!account.verified ? '이메일 인증이 아직 안 된 계정이에요.' : isPro ? '여러 차량, PDF 저장 등 PRO 기능이 모두 열려 있어요.' : '일반 계정이에요.'}</p>
    <button type="button" class="btn" id="logoutBtn" style="width:100%">로그아웃</button></section>`;
}
const VIEWS = {home:viewHome, trips:viewTrips, costs:viewCosts, biz:viewBiz, report:viewReport, car:viewCar};

function render(){
  const c = car();
  $('carName').innerHTML = esc(c.name) + (isPro ? '<span class="probadge">PRO</span>' : ''); $('carSub').textContent = (c.plate ? c.plate + ' · ' : '') + fuel().t;
  $('mLabel').textContent = monthLabel();
  $('main').innerHTML = VIEWS[tab]();
  $('main').scrollTop = 0;
  document.querySelectorAll('#tabs button').forEach(b => { if (b.dataset.tab === tab) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  $('fab').hidden = !(tab === 'trips' || tab === 'costs' || tab === 'home');
  bindView();
}
function bindView(){
  const cs = $('clearSample');
  if (cs) cs.onclick = () => {
    const bar = $('sampleBar');
    bar.innerHTML = '<span>예시 기록을 모두 지울까요?</span><span class="confirm" style="margin-left:auto"><button type="button" class="btn" id="noClr" style="padding:6px 10px">취소</button><button type="button" class="btn pri" id="yesClr" style="padding:6px 10px">지우기</button></span>';
    $('noClr').onclick = render;
    $('yesClr').onclick = () => { const c = car(); S = {sample:false, cars:[{...c, odo:48210}], carId:c.id, trips:[], costs:[], biz:[{id:'b1', name:'새 출장', place:'', start:ymd(new Date()), end:ymd(new Date()), members:['나']}], bizExp:[], bizId:'b1'}; save(); render(); toast('예시 데이터를 지웠어요'); };
  };
  document.querySelectorAll('[data-del-trip]').forEach(b => b.onclick = () => { const t = S.trips.find(x=>x.id===b.dataset.delTrip); S.trips = S.trips.filter(x=>x!==t); if (t) car().odo = Math.max(0, car().odo - t.km); save(); render(); toast('운행 기록을 삭제했어요'); });
  document.querySelectorAll('[data-del-cost]').forEach(b => b.onclick = () => { S.costs = S.costs.filter(x=>x.id!==b.dataset.delCost); save(); render(); toast('비용 기록을 삭제했어요'); });
  document.querySelectorAll('[data-edit-car]').forEach(b => b.onclick = () => carSheet(b.dataset.editCar));
  if ($('addCar')) $('addCar').onclick = () => isPro ? newCarSheet() : proSheet();
  if ($('pdfBtn')) $('pdfBtn').onclick = () => isPro && printReport();
  if ($('loginBtn')) $('loginBtn').onclick = loginSheet;
  if ($('logoutBtn')) $('logoutBtn').onclick = logout;
  document.querySelectorAll('[data-use-car]').forEach(b => b.onclick = () => { S.carId = b.dataset.useCar; save(); render(); toast(car().name + ' 기록을 보여 드려요'); });
  document.querySelectorAll('[data-del-car]').forEach(b => b.onclick = () => { const c = S.cars.find(x=>x.id===b.dataset.delCar); if (!c || !confirmDel(b, c.name)) return; });
  if ($('openScan')) $('openScan').onclick = () => scanStart('car');
  if ($('bizScan')) $('bizScan').onclick = () => scanStart('biz');
  if ($('bizExcel')) $('bizExcel').onclick = bizExcelSheet;
  if ($('bizEdit')) $('bizEdit').onclick = bizEditSheet;
  document.querySelectorAll('[data-del-biz]').forEach(x => x.onclick = () => { S.bizExp = S.bizExp.filter(e=>e.id!==x.dataset.delBiz); save(); render(); toast('경비를 삭제했어요'); });
  if ($('rWork')) { $('rWork').onclick = () => { onlyWork = true; render(); }; $('rAll').onclick = () => { onlyWork = false; render(); }; }
  if ($('copyCsv')) $('copyCsv').onclick = () => {
    const text = csvText(), box = $('csvBox');
    const fallback = () => { box.hidden = false; box.value = text; box.focus(); box.select(); toast('아래 내용을 길게 눌러 복사해 주세요'); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => toast('CSV를 복사했어요'), fallback); else fallback();
  };
}
$('tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; tab = b.dataset.tab; render(); });
$('mPrev').onclick = () => shiftMonth(-1);
$('mNext').onclick = () => shiftMonth(1);
$('fab').onclick = () => {
  if (tab === 'costs') return costSheet();
  if (tab === 'trips') return tripSheet();
  openSheet(`<h3>무엇을 기록할까요?</h3><div class="row"><button type="button" class="btn pri" id="pickTrip">운행 기록</button><button type="button" class="btn pri" id="pickCost">비용 기록</button></div>`, () => { $('pickTrip').onclick = tripSheet; $('pickCost').onclick = costSheet; });
};
/* 차량 삭제: 버튼을 한 번 더 눌러야 지워짐(실수 방지). 그 차의 기록도 같이 지움 */
function confirmDel(btn, name){
  if (btn.dataset.armed) { const id = btn.dataset.delCar;
    S.cars = S.cars.filter(x => x.id !== id); S.trips = S.trips.filter(x => x.car !== id); S.costs = S.costs.filter(x => x.car !== id);
    save(); render(); toast(name + '을(를) 삭제했어요'); return true; }
  btn.dataset.armed = '1'; btn.textContent = '정말 삭제'; btn.style.color = 'var(--danger)'; btn.style.borderColor = 'var(--danger)';
  setTimeout(() => { if (btn.isConnected){ delete btn.dataset.armed; btn.textContent = '삭제'; btn.style.color = ''; btn.style.borderColor = ''; } }, 3000);
  return false;
}
/* 첫 실행: 환영 화면 */
let welcomed = false; try { welcomed = localStorage.getItem('gorodrive.welcomed') === '1'; } catch(_){}
function closeWelcome(){ $('welcome').hidden = true; try { localStorage.setItem('gorodrive.welcomed', '1'); } catch(_){} }
if (!welcomed) $('welcome').hidden = false;
$('wDemo').onclick = () => { closeWelcome(); tab = 'home'; render(); };
$('wStart').onclick = () => {
  closeWelcome();
  S = {sample:false, cars:[{id:'c1', name:'내 차', plate:'', fuel:'gas', odo:0}], carId:'c1', trips:[], costs:[], biz:[{id:'b1', name:'새 출장', place:'', start:ymd(new Date()), end:ymd(new Date()), members:['나']}], bizExp:[], bizId:'b1'};
  save(); tab = 'car'; render(); carSheet('c1');
};
$('wLogin').onclick = () => { closeWelcome(); tab = 'car'; render(); loginSheet(); };
render();
window.__hideSplash && window.__hideSplash();
/* 예전에 로그인했으면 조용히 계정 상태 확인(오프라인이면 마지막 상태 유지) */
loadAuth().catch(() => {});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/gdtest/sw.js', { scope: '/gdtest/' }).catch(() => {});
})();
</script>
